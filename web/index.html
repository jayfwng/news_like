<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>뉴스스냅</title>
  <meta name="description" content="많이 보는 뉴스를 인스타그램처럼 넘겨 보고, 모르는 경제 용어는 바로 찾아보는 앱">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">뉴스스냅</h1>
    <span class="updated" id="updated"></span>
    <button class="icon-btn" id="refresh" aria-label="새로고침" title="새로고침">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg>
    </button>
  </header>

  <main id="view-home" class="view">
    <section class="market" id="market" aria-label="경제 지표"></section>
    <section class="stories" id="stories" aria-label="분야별 스토리"></section>
    <section class="today-terms" id="today-terms" hidden>
      <h2>오늘 뉴스에 많이 나온 경제 용어</h2>
      <div class="chips" id="term-chips"></div>
    </section>
    <nav class="filters" id="filters" aria-label="분야 고르기"></nav>
    <div class="feed" id="feed"></div>
    <p class="feed-end" id="feed-end" hidden>오늘의 뉴스를 다 봤어요 👏</p>
  </main>

  <main id="view-saved" class="view" hidden>
    <h2 class="view-title">저장한 뉴스</h2>
    <div class="feed" id="saved-feed"></div>
    <p class="empty" id="saved-empty">뉴스의 🔖 버튼을 누르면 여기에 모여요.</p>
  </main>

  <main id="view-words" class="view" hidden>
    <h2 class="view-title">내 단어장</h2>
    <div class="word-list" id="word-list"></div>
    <p class="empty" id="words-empty">밑줄 친 단어를 누르거나 글자를 길게 눌러 뜻을 찾은 뒤 ☆를 누르면 여기에 모여요.</p>
    <h2 class="view-title">경제 용어 사전</h2>
    <input class="search" id="dict-search" type="search" placeholder="용어 검색 (예: 기준금리, DSR)">
    <div class="word-list" id="dict-list"></div>
  </main>

  <nav class="tabbar" aria-label="메뉴">
    <button data-view="home" class="active" aria-label="홈">
      <svg viewBox="0 0 24 24"><path d="M4 10.2 12 4l8 6.2V20h-5.5v-5.5h-5V20H4z"/></svg><span>홈</span>
    </button>
    <button data-view="saved" aria-label="저장">
      <svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg><span>저장</span>
    </button>
    <button data-view="words" aria-label="단어장">
      <svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-3a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h4z"/></svg><span>단어장</span>
    </button>
  </nav>

  <!-- 스토리 보기 -->
  <div class="story-viewer" id="story-viewer" hidden>
    <div class="story-bars" id="story-bars"></div>
    <div class="story-head">
      <span class="story-topic" id="story-topic"></span>
      <button class="icon-btn light" id="story-close" aria-label="닫기">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="story-body" id="story-body"></div>
    <button class="story-nav prev" id="story-prev" aria-label="이전"></button>
    <button class="story-nav next" id="story-next" aria-label="다음"></button>
  </div>

  <!-- 단어 뜻 -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-term">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="sheet-term"></h3>
      <span class="sheet-cat" id="sheet-cat"></span>
      <button class="icon-btn" id="sheet-star" aria-label="단어장에 저장">☆</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-links" id="sheet-links"></div>
  </section>

  <button class="lookup-fab" id="lookup-fab" hidden></button>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
