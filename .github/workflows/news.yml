name: 뉴스 수집 및 배포

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 사정에 따라 몇 분 늦을 수 있어요)
  workflow_dispatch:          # Actions 탭에서 직접 실행
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 테스트
        run: python -m unittest discover -s tests -v
      - name: 뉴스 수집
        run: python scripts/crawl.py --out web/data/news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
